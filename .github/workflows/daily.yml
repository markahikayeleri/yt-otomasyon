name: gunluk-video

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Araclar
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Paketler
        run: pip install -r requirements.txt
      - name: Orkestratoru calistir
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      - name: Test videolarini indirilebilir yap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videolar
          path: |
            output/*.mp4
            output/thumb.jpg
          retention-days: 3
          if-no-files-found: ignore
      - name: Konu gecmisini kaydet
        if: always()
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || (git commit -m "Gunluk kayit" && git push)
